services:
  - type: web
    name: anh-van-ban-community
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_USER
        sync: false
      - key: ADMIN_PASS
        sync: false
      - key: DATA_DIR
        value: /opt/render/project/src/storage/data
      - key: UPLOAD_DIR
        value: /opt/render/project/src/storage/uploads
    disk:
      name: app-storage
      mountPath: /opt/render/project/src/storage
      sizeGB: 1
