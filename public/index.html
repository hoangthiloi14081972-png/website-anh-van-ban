<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kho Ảnh & Văn Bản</title><link rel="stylesheet" href="style.css">
</head>
<body>
<header><div class="brand">Kho Ảnh & Văn Bản</div><nav id="nav"></nav></header>
<main>
<section id="auth" class="card">
  <div class="tabs"><button onclick="showAuth('login')">Đăng nhập</button><button onclick="showAuth('register')">Đăng ký</button></div>
  <form id="loginForm"><h2>Đăng nhập</h2><input name="username" placeholder="Tên tài khoản" required><input name="password" type="password" placeholder="Mật khẩu" required><button>Đăng nhập</button></form>
  <form id="registerForm" class="hidden"><h2>Tạo tài khoản</h2><input name="username" placeholder="Tên tài khoản" required><input name="password" type="password" placeholder="Mật khẩu (ít nhất 6 ký tự)" required><button>Gửi yêu cầu đăng ký</button><p class="muted">Tài khoản phải được quản trị viên duyệt trước khi truy cập.</p></form>
</section>

<section id="app" class="hidden">
  <div class="hero"><div><h1>Chia sẻ ảnh & văn bản</h1><p>Đăng bài, xem nội dung và bình luận.</p></div><button id="newPostBtn">+ Đăng bài</button></div>
  <div id="posts"></div>
</section>

<section id="admin" class="hidden">
  <div class="hero"><div><h1>Quản trị</h1><p>Duyệt tài khoản, chỉnh sửa/xóa bài viết và xóa bình luận.</p></div></div>
  <div class="card"><h2>Tài khoản chờ duyệt</h2><div id="users"></div></div>
</section>

<div id="modal" class="modal hidden"><div class="modalBox"><button class="close" onclick="closeModal()">×</button><div id="modalContent"></div></div></div>
<div id="toast"></div>
</main>
<script src="app.js"></script>
</body></html>
